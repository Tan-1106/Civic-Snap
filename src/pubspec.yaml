name: src
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^9.2.0
  equatable: ^2.0.8
  provider: ^6.1.5+1
  go_router: ^17.0.1
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  google_fonts: ^7.0.0
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.14.0
  flutter_secure_storage: ^10.0.0
  internet_connection_checker_plus: ^2.9.1+2

  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  image_path: "assets/images/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/